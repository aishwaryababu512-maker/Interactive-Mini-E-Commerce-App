
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini E-Commerce Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #4936b5;
    color: white;
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h1 {
    font-size: 25px;
}

.cart-button {
    background: white;
    color: #4936b5;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 15px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #4936b5;
}

.products {
    display: grid;
    grid-template-columns: repeat(
        auto-fit, minmax(220px, 1fr)
    );
    gap: 22px;
}

.product {
    background: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 15px #0001;
    transition: 0.3s;
}

.product:hover {
    transform: translateY(-8px);
    box-shadow: 0 10px 25px #4936b533;
}

.product .emoji {
    font-size: 65px;
    margin: 15px;
}

.product h3 {
    margin: 12px 0;
}

.product p {
    color: #4936b5;
    font-size: 21px;
    font-weight: bold;
    margin: 12px;
}

button {
    cursor: pointer;
}

.add-btn {
    background: #4936b5;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 8px;
}

.add-btn:hover {
    background: #30218c;
}

.cart-section {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-top: 35px;
    box-shadow: 0 4px 15px #0001;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #eee;
    padding: 14px 0;
    flex-wrap: wrap;
}

.quantity button,
.remove-btn {
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    margin: 2px;
}

.quantity button {
    background: #e8e5ff;
    color: #4936b5;
}

.remove-btn {
    background: #ffdddd;
    color: #c62828;
}

.total {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
}

.checkout-btn {
    display: block;
    margin: 20px 0 0 auto;
    background: #159957;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    font-size: 16px;
}

.checkout-btn:disabled {
    background: #999;
    cursor: not-allowed;
}

/* Checkout modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

.modal-content h2 {
    margin-bottom: 15px;
}

.modal-content p {
    margin: 12px 0;
}

.modal-content button {
    padding: 11px 20px;
    margin: 10px 5px;
    border: none;
    border-radius: 7px;
    background: #4936b5;
    color: white;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

@media(max-width: 500px) {
    header {
        justify-content: center;
        text-align: center;
    }

    .cart-item {
        flex-direction: column;
        align-items: flex-start;
    }

    .total {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛍️ My Shopping Store</h1>

    <button class="cart-button"
        onclick="showCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<div class="container">

    <h2>Our Products</h2>

    <div class="products" id="products"></div>

    <div class="cart-section" id="cartSection">

        <h2>Shopping Cart</h2>

        <div id="cartItems">
            Your cart is empty.
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout-btn"
            id="checkoutBtn"
            onclick="checkout()"
            disabled>
            Proceed to Checkout
        </button>

    </div>
</div>

<!-- Checkout modal -->

<div class="modal" id="checkoutModal">

    <div class="modal-content">

        <h2>Order Preview 🎉</h2>

        <div id="orderDetails"></div>

        <p>
            <strong>Total: ₹<span id="orderTotal">0</span></strong>
        </p>

        <p>Thank you for shopping with us!</p>

        <button onclick="placeOrder()">
            Confirm Order
        </button>

        <button onclick="closeModal()">
            Close
        </button>

    </div>
</div>

<footer>
    <p>© 2026 My Shopping Store | Built with HTML, CSS & JavaScript</p>
</footer>

<script>

// Product data stored in JavaScript objects

const products = [
    {
        id: 1,
        name: "Headphones",
        price: 999,
        emoji: "🎧"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1499,
        emoji: "⌚"
    },
    {
        id: 3,
        name: "Laptop Bag",
        price: 799,
        emoji: "💼"
    },
    {
        id: 4,
        name: "Keyboard",
        price: 599,
        emoji: "⌨️"
    },
    {
        id: 5,
        name: "Camera",
        price: 2499,
        emoji: "📷"
    },
    {
        id: 6,
        name: "Speaker",
        price: 1199,
        emoji: "🔊"
    }
];

let cart = [];

// Display products dynamically

function displayProducts() {

    const productArea =
        document.getElementById("products");

    productArea.innerHTML = products.map(product => `
        <div class="product">
            <div class="emoji">${product.emoji}</div>
            <h3>${product.name}</h3>
            <p>₹${product.price}</p>

            <button class="add-btn"
                onclick="addToCart(${product.id})">
                Add to Cart
            </button>
        </div>
    `).join("");
}

// Add product to cart

function addToCart(id) {

    const product =
        products.find(item => item.id === id);

    const existing =
        cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    updateCart();
}

// Update shopping cart

function updateCart() {

    const cartArea =
        document.getElementById("cartItems");

    let count = 0;
    let total = 0;

    if (cart.length === 0) {
        cartArea.innerHTML = "Your cart is empty.";
    } else {

        cartArea.innerHTML = cart.map(item => {

            count += item.quantity;
            total += item.price * item.quantity;

            return `
                <div class="cart-item">

                    <strong>
                        ${item.emoji} ${item.name}
                    </strong>

                    <div>
                        ₹${item.price}
                    </div>

                    <div class="quantity">

                        <button onclick="changeQuantity(${item.id}, -1)">
                            -
                        </button>

                        ${item.quantity}

                        <button onclick="changeQuantity(${item.id}, 1)">
                            +
                        </button>

                    </div>

                    <button class="remove-btn"
                        onclick="removeItem(${item.id})">
                        Delete
                    </button>

                </div>
            `;

        }).join("");
    }

    document.getElementById("cartCount")
        .textContent = count;

    document.getElementById("total")
        .textContent = total;

    document.getElementById("checkoutBtn")
        .disabled = cart.length === 0;
}

// Change quantity

function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        removeItem(id);
    } else {
        updateCart();
    }
}

// Remove product

function removeItem(id) {

    cart = cart.filter(item => item.id !== id);

    updateCart();
}

// Scroll to cart

function showCart() {

    document.getElementById("cartSection")
        .scrollIntoView({behavior: "smooth"});
}

// Checkout preview

function checkout() {

    if (cart.length === 0) return;

    const details =
        document.getElementById("orderDetails");

    details.innerHTML = cart.map(item => `
        <p>
            ${item.name} × ${item.quantity}
            = ₹${item.price * item.quantity}
        </p>
    `).join("");

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    document.getElementById("orderTotal")
        .textContent = total;

    document.getElementById("checkoutModal")
        .style.display = "flex";
}

// Close checkout

function closeModal() {

    document.getElementById("checkoutModal")
        .style.display = "none";
}

// Confirm demo order

function placeOrder() {

    alert("Your demo order has been placed successfully!");

    cart = [];
    updateCart();
    closeModal();
}

// Start application

displayProducts();
updateCart();

</script>

</body>
</html>
